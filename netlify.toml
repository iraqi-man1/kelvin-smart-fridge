[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "nodemailer"]

# The dashboard is one page; every other address opens it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
